<svg width="100%" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050014"/>
      <stop offset="45%" stop-color="#1a0742"/>
      <stop offset="75%" stop-color="#3a0e4f"/>
      <stop offset="100%" stop-color="#05010d"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d6"/>
      <stop offset="30%" stop-color="#ffcf6b"/>
      <stop offset="60%" stop-color="#ff5fa2"/>
      <stop offset="100%" stop-color="#ff2ea6"/>
    </radialGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f7ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f7ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff2ea6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sunClip"><circle cx="600" cy="150" r="62"/></clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.2" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="28" r="1.1" opacity="0.7"/><circle cx="140" cy="55" r="1" opacity="0.5"/>
    <circle cx="230" cy="20" r="1.3" opacity="0.8"/><circle cx="310" cy="60" r="0.9" opacity="0.4"/>
    <circle cx="900" cy="30" r="1.2" opacity="0.7"/><circle cx="980" cy="58" r="1" opacity="0.5"/>
    <circle cx="1060" cy="22" r="1.3" opacity="0.8"/><circle cx="1140" cy="50" r="1" opacity="0.5"/>
    <circle cx="420" cy="15" r="0.9" opacity="0.5"/><circle cx="780" cy="18" r="0.9" opacity="0.5"/>
  </g>

  <!-- sun -->
  <circle cx="600" cy="150" r="62" fill="url(#sunGrad)" filter="url(#glow)"/>
  <g clip-path="url(#sunClip)" fill="#0f0420">
    <rect x="533" y="144" width="134" height="5"/>
    <rect x="533" y="156" width="134" height="6"/>
    <rect x="533" y="169" width="134" height="7"/>
    <rect x="533" y="183" width="134" height="9"/>
    <rect x="533" y="199" width="134" height="13"/>
  </g>

  <!-- city skyline silhouettes -->
  <g fill="#0a0218">
    <rect x="20" y="175" width="26" height="65"/><rect x="50" y="150" width="18" height="90"/>
    <rect x="72" y="190" width="22" height="50"/><rect x="98" y="160" width="16" height="80"/>
    <rect x="118" y="200" width="30" height="40"/><rect x="152" y="140" width="20" height="100"/>
    <rect x="1040" y="140" width="20" height="100"/><rect x="1064" y="200" width="30" height="40"/>
    <rect x="1098" y="160" width="16" height="80"/><rect x="1118" y="190" width="22" height="50"/>
    <rect x="1144" y="150" width="18" height="90"/><rect x="1166" y="175" width="26" height="65"/>
  </g>
  <g fill="#00f7ff" opacity="0.55">
    <rect x="26" y="185" width="3" height="3"/><rect x="34" y="200" width="3" height="3"/>
    <rect x="56" y="165" width="3" height="3"/><rect x="56" y="180" width="3" height="3"/>
    <rect x="1160" y="185" width="3" height="3"/><rect x="1150" y="165" width="3" height="3"/>
  </g>
  <g fill="#ff2ea6" opacity="0.5">
    <rect x="103" y="175" width="3" height="3"/><rect x="1090" y="175" width="3" height="3"/>
  </g>

  <!-- perspective grid -->
  <g stroke="url(#gridFade)" stroke-width="1.4" opacity="0.85">
    <line x1="600" y1="184" x2="-60" y2="280"/>
    <line x1="600" y1="184" x2="110" y2="280"/>
    <line x1="600" y1="184" x2="280" y2="280"/>
    <line x1="600" y1="184" x2="450" y2="280"/>
    <line x1="600" y1="184" x2="600" y2="280"/>
    <line x1="600" y1="184" x2="750" y2="280"/>
    <line x1="600" y1="184" x2="920" y2="280"/>
    <line x1="600" y1="184" x2="1090" y2="280"/>
    <line x1="600" y1="184" x2="1260" y2="280"/>
  </g>
  <g stroke="#00f7ff" opacity="0.45">
    <line x1="0" y1="193" x2="1200" y2="193" stroke-width="0.8"/>
    <line x1="0" y1="204" x2="1200" y2="204" stroke-width="0.9"/>
    <line x1="0" y1="218" x2="1200" y2="218" stroke-width="1"/>
    <line x1="0" y1="236" x2="1200" y2="236" stroke-width="1.2"/>
    <line x1="0" y1="260" x2="1200" y2="260" stroke-width="1.6"/>
  </g>

  <!-- title glow core -->
  <text x="602" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#00f7ff" filter="url(#glow)" opacity="0.9">
    VAISHNAVI KHANDELWAL
    <animate attributeName="opacity" values="0.9;0.9;0.55;0.9;0.9;0.9;0.4;0.9" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#f5fbff">
    VAISHNAVI KHANDELWAL
  </text>

  <text x="600" y="128" text-anchor="middle" font-family="Courier New, monospace" font-size="17" letter-spacing="5" fill="#ff2ea6" filter="url(#glow)">
    SYSTEM&#160;ARCHITECT&#160;//&#160;CYBERPUNK&#160;ENGINEER
  </text>

  <rect width="1200" height="280" fill="url(#scan)"/>
  <rect width="1200" height="280" fill="url(#vignette)"/>
</svg>
