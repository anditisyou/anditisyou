<svg width="100%" viewBox="0 0 1598 984" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="60%" stop-color="#0d0808"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b52"/>
      <stop offset="35%" stop-color="#d6362f"/>
      <stop offset="70%" stop-color="#7a1418"/>
      <stop offset="100%" stop-color="#7a1418" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silhouette" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#050506"/>
      <stop offset="100%" stop-color="#1a0f0f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8066" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff8066" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ctaLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C1272D"/>
      <stop offset="100%" stop-color="#C1272D" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.2" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1598" height="984" fill="url(#bg)"/>

  <!-- moon glow -->
  <circle cx="990" cy="340" r="260" fill="url(#moon)"/>

  <!-- distant skyline silhouette inside the glow -->
  <g fill="#3a0d0d" opacity="0.55">
    <rect x="800" y="420" width="24" height="140"/><rect x="830" y="380" width="18" height="180"/>
    <rect x="855" y="440" width="30" height="120"/><rect x="892" y="360" width="16" height="200"/>
    <rect x="915" y="410" width="26" height="150"/><rect x="948" y="390" width="20" height="170"/>
    <rect x="975" y="430" width="34" height="130"/><rect x="1016" y="370" width="18" height="190"/>
    <rect x="1040" y="415" width="24" height="145"/><rect x="1070" y="395" width="20" height="165"/>
    <rect x="1096" y="435" width="30" height="125"/><rect x="1132" y="405" width="18" height="155"/>
    <rect x="1156" y="425" width="26" height="135"/>
  </g>

  <!-- stylized silhouette figure (rim-lit, no facial detail — original vector work, not a likeness) -->
  <g>
    <path d="M 760 984 L 760 640 C 758 560 790 500 850 470 C 900 445 935 430 945 385
             C 950 360 945 335 930 320 C 950 300 980 300 995 320 C 1010 340 1005 365 990 385
             C 1000 430 1040 450 1080 480 C 1140 520 1160 600 1155 680 L 1150 984 Z"
          fill="url(#silhouette)"/>
    <path d="M 945 385 C 950 360 945 335 930 320 C 950 300 980 300 995 320 C 1010 340 1005 365 990 385
             C 985 400 955 400 945 385 Z" fill="#050506"/>
    <path d="M 850 470 C 900 445 935 430 945 385 C 950 400 985 400 990 385
             C 1000 430 1040 450 1080 480 C 1140 520 1160 600 1155 680 L 1150 984 L 1140 984
             L 1145 685 C 1148 610 1128 535 1075 495 C 1035 465 995 445 988 400"
          fill="none" stroke="url(#rim)" stroke-width="2.5" opacity="0.8"/>
    <!-- faint embroidery motif on the cloak -->
    <g fill="#C1272D" opacity="0.18" font-family="Georgia, serif" font-size="20">
      <text x="1000" y="560">観</text>
      <text x="1040" y="610">察</text>
      <text x="980" y="660">創</text>
    </g>
  </g>

  <!-- top nav -->
  <text x="122" y="52" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="24" letter-spacing="3" fill="#F2EDE4">VAISHNAVI KHANDELWAL</text>
  <rect x="408" y="28" width="26" height="26" fill="none" stroke="#C1272D" stroke-width="1"/>
  <text x="421" y="47" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C1272D">観</text>

  <g font-family="Courier New, monospace" font-size="13" letter-spacing="2">
    <text x="935" y="50" fill="#C1272D">OBSERVE</text>
    <line x1="935" y1="60" x2="1007" y2="60" stroke="#C1272D" stroke-width="1.5"/>
    <text x="1050" y="50" fill="#8A8378">BUILD</text>
    <text x="1140" y="50" fill="#8A8378">RESEARCH</text>
    <text x="1260" y="50" fill="#8A8378">CREATE</text>
    <text x="1360" y="50" fill="#8A8378">BEYOND</text>
  </g>
  <circle cx="1543" cy="46" r="20" fill="none" stroke="#4a4440" stroke-width="1"/>
  <line x1="1534" y1="41" x2="1552" y2="41" stroke="#D8D3C8" stroke-width="1.3"/>
  <line x1="1534" y1="46" x2="1552" y2="46" stroke="#D8D3C8" stroke-width="1.3"/>
  <line x1="1534" y1="51" x2="1552" y2="51" stroke="#D8D3C8" stroke-width="1.3"/>

  <!-- left vertical kanji strip -->
  <g font-family="Georgia, serif" font-size="19" fill="#C1272D" text-anchor="middle" opacity="0.9">
    <text x="38" y="45">観</text><text x="38" y="72">察</text><text x="38" y="99">す</text><text x="38" y="126">る</text>
    <text x="38" y="163">・</text>
    <text x="38" y="198">構</text><text x="38" y="225">築</text><text x="38" y="252">す</text><text x="38" y="279">る</text>
    <text x="38" y="316">・</text>
  </g>
  <circle cx="46" cy="355" r="7" fill="none" stroke="#8A8378" stroke-width="1"/>
  <line x1="46" y1="365" x2="46" y2="430" stroke="#4a4440" stroke-width="1"/>

  <!-- headline -->
  <text x="153" y="300" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="92" fill="#F2EDE4">THE</text>
  <text x="153" y="405" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="92">
    <tspan fill="#F2EDE4">OBSER</tspan><tspan fill="#C1272D">V</tspan><tspan fill="#F2EDE4">ATORY</tspan>
  </text>

  <text x="155" y="452" font-family="Courier New, monospace" font-size="16" letter-spacing="4" fill="#C1272D">KANSOKU &#8212; OBSERVATION</text>

  <text x="155" y="522" font-family="Georgia, serif" font-size="19" fill="#D8D3C8">Where Engineering meets Observation.</text>
  <text x="155" y="552" font-family="Georgia, serif" font-size="19" fill="#D8D3C8">Where Observation inspires <tspan fill="#C1272D">Creation</tspan>.</text>

  <!-- signature -->
  <path d="M 155 618 C 175 600 190 630 210 610 C 225 596 235 618 260 605" fill="none" stroke="#D8D3C8" stroke-width="1.3" opacity="0.75"/>
  <rect x="270" y="595" width="24" height="24" fill="none" stroke="#C1272D" stroke-width="1"/>
  <text x="282" y="612" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#C1272D">創</text>

  <!-- CTA -->
  <text x="155" y="760" font-family="Courier New, monospace" font-size="16" letter-spacing="3" fill="#F2EDE4">ENTER THE OBSERVATORY</text>
  <circle cx="478" cy="753" r="21" fill="none" stroke="#C1272D" stroke-width="1.3"/>
  <path d="M 470 753 L 486 753 M 480 746 L 487 753 L 480 760" fill="none" stroke="#C1272D" stroke-width="1.5"/>
  <rect x="155" y="778" width="360" height="2" fill="url(#ctaLine)"/>

  <!-- bottom-left vertical label -->
  <g font-family="Courier New, monospace" font-size="11" letter-spacing="2" fill="#5a5450">
    <text x="42" y="700" transform="rotate(-90 42 700)">THE OBSERVATORY &#8212; 2026</text>
  </g>
  <circle cx="47" cy="940" r="19" fill="none" stroke="#C1272D" stroke-width="1"/>
  <text x="47" y="946" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#C1272D">巡</text>

  <!-- right sidebar numbered list -->
  <g font-family="Courier New, monospace">
    <!-- 01 BUILD -->
    <rect x="1245" y="175" width="90" height="90" fill="#2a0f0f"/>
    <rect x="1245" y="175" width="90" height="90" fill="#C1272D" opacity="0.25"/>
    <text x="1358" y="200" font-size="15" fill="#5a5450">01</text>
    <text x="1385" y="200" font-family="Georgia, serif" font-size="15" fill="#8A8378">構築する</text>
    <text x="1358" y="228" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#C1272D">BUILD</text>
    <text x="1358" y="253" font-size="13" fill="#8A8378">Engineering solutions</text>
    <text x="1358" y="271" font-size="13" fill="#8A8378">that create impact.</text>

    <!-- 02 RESEARCH -->
    <rect x="1245" y="305" width="90" height="90" fill="#0d1420"/>
    <rect x="1245" y="305" width="90" height="90" fill="#3f6fb5" opacity="0.22"/>
    <text x="1358" y="330" font-size="15" fill="#5a5450">02</text>
    <text x="1385" y="330" font-family="Georgia, serif" font-size="15" fill="#8A8378">研究する</text>
    <text x="1358" y="358" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#6fa0e0">RESEARCH</text>
    <text x="1358" y="383" font-size="13" fill="#8A8378">Exploring ideas that</text>
    <text x="1358" y="401" font-size="13" fill="#8A8378">push boundaries.</text>

    <!-- 03 CREATE -->
    <rect x="1245" y="490" width="90" height="90" fill="#180d26"/>
    <rect x="1245" y="490" width="90" height="90" fill="#8b5fd6" opacity="0.22"/>
    <text x="1358" y="515" font-size="15" fill="#5a5450">03</text>
    <text x="1385" y="515" font-family="Georgia, serif" font-size="15" fill="#8A8378">創造する</text>
    <text x="1358" y="543" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#b28fe8">CREATE</text>
    <text x="1358" y="568" font-size="13" fill="#8A8378">Capturing moments.</text>
    <text x="1358" y="586" font-size="13" fill="#8A8378">Expressing thoughts.</text>

    <!-- 04 BEYOND -->
    <rect x="1245" y="655" width="90" height="90" fill="#241a08"/>
    <rect x="1245" y="655" width="90" height="90" fill="#d6a13f" opacity="0.22"/>
    <text x="1358" y="680" font-size="15" fill="#5a5450">04</text>
    <text x="1385" y="680" font-family="Georgia, serif" font-size="15" fill="#8A8378">余白を生きる</text>
    <text x="1358" y="708" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#e0b866">BEYOND</text>
    <text x="1358" y="733" font-size="13" fill="#8A8378">The human behind</text>
    <text x="1358" y="751" font-size="13" fill="#8A8378">the work.</text>
  </g>

  <line x1="1245" y1="290" x2="1245" y2="655" stroke="#3a1416" stroke-width="1"/>

  <!-- bottom status bar -->
  <text x="1245" y="918" font-family="Courier New, monospace" font-size="12" letter-spacing="2" fill="#5a5450">NOW OBSERVING</text>
  <text x="1245" y="944" font-family="Georgia, serif" font-size="18" fill="#F2EDE4">Distributed Systems Design</text>
  <g stroke="#C1272D" stroke-width="2" opacity="0.75">
    <line x1="1400" y1="948" x2="1400" y2="928"/><line x1="1410" y1="948" x2="1410" y2="918"/>
    <line x1="1420" y1="948" x2="1420" y2="935"/><line x1="1430" y1="948" x2="1430" y2="922"/>
    <line x1="1440" y1="948" x2="1440" y2="932"/><line x1="1450" y1="948" x2="1450" y2="915"/>
    <line x1="1460" y1="948" x2="1460" y2="938"/><line x1="1470" y1="948" x2="1470" y2="925"/>
    <line x1="1480" y1="948" x2="1480" y2="930"/><line x1="1490" y1="948" x2="1490" y2="920"/>
    <line x1="1500" y1="948" x2="1500" y2="940"/>
  </g>
  <circle cx="1548" cy="928" r="20" fill="none" stroke="#C1272D" stroke-width="1.3"/>
  <path d="M 1542 919 L 1542 937 L 1557 928 Z" fill="#C1272D"/>

  <rect width="1598" height="984" fill="url(#grain)"/>
</svg>
