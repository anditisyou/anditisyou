<svg width="100%" viewBox="0 0 1200 170" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05010d"/>
      <stop offset="60%" stop-color="#210a3e"/>
      <stop offset="100%" stop-color="#3a0e4f"/>
    </linearGradient>
    <linearGradient id="gridFade2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2ea6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f7ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff2ea6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan2" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.2" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="170" fill="url(#sky2)"/>

  <g stroke="url(#gridFade2)" stroke-width="1.2" opacity="0.8">
    <line x1="600" y1="40" x2="-60" y2="170"/>
    <line x1="600" y1="40" x2="150" y2="170"/>
    <line x1="600" y1="40" x2="360" y2="170"/>
    <line x1="600" y1="40" x2="600" y2="170"/>
    <line x1="600" y1="40" x2="840" y2="170"/>
    <line x1="600" y1="40" x2="1050" y2="170"/>
    <line x1="600" y1="40" x2="1260" y2="170"/>
  </g>
  <g stroke="#00f7ff" opacity="0.4">
    <line x1="0" y1="60" x2="1200" y2="60" stroke-width="0.8"/>
    <line x1="0" y1="90" x2="1200" y2="90" stroke-width="1"/>
    <line x1="0" y1="130" x2="1200" y2="130" stroke-width="1.4"/>
  </g>

  <text x="600" y="105" text-anchor="middle" font-family="Courier New, monospace" font-size="20" letter-spacing="6" fill="#00f7ff" filter="url(#glow2)">
    &gt;_&#160;END&#160;OF&#160;TRANSMISSION
    <animate attributeName="opacity" values="1;1;0.5;1;1" dur="3.2s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="132" text-anchor="middle" font-family="Courier New, monospace" font-size="13" letter-spacing="3" fill="#ff2ea6" opacity="0.9">
    thanks for stopping by // stay scalable
  </text>

  <rect width="1200" height="170" fill="url(#scan2)"/>
</svg>
